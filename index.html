<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#11100d">
<title>A&Z Girls Fashion | متجر المنتجات</title>
<style>
:root{color-scheme:light;--bg:#faf8f3;--card:#fff;--text:#211c12;--muted:#756d5e;--gold:#bd8c24;--gold-dark:#8c6413;--ink:#11100d;--line:#eee5d3;--soft:#f7f0df;--danger:#a42d2d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif}
button,input{font:inherit}
button{cursor:pointer}
.container{width:min(1160px,100% - 32px);margin:auto}
.topbar{position:sticky;top:0;z-index:5;background:#11100df2;color:#fff;border-bottom:1px solid #bd8c2466;backdrop-filter:blur(14px)}
.topbar-inner{min-height:78px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.brand{display:flex;align-items:center;gap:13px;font-size:20px;font-weight:800;letter-spacing:.3px}
.brand img{width:58px;height:58px;border:2px solid var(--gold);border-radius:50%;background:#fff;object-fit:cover;box-shadow:0 0 0 4px #bd8c241c}
.brand span{display:block;margin-top:3px;color:#e6c46e;font-size:12px;letter-spacing:1.6px}
.topbar-actions{display:flex;align-items:center;gap:22px}
.topbar-note{display:flex;align-items:center;gap:9px;color:#ead9aa;font-size:14px}
.topbar-note:before{width:8px;height:8px;border-radius:50%;background:#8ac79b;box-shadow:0 0 12px #8ac79b;content:""}
.contact-link{display:inline-flex;align-items:center;gap:8px;color:#fff;text-decoration:none;font-size:14px;font-weight:700;transition:color .2s}
.contact-link:hover{color:#e6c46e}
.contact-link:focus-visible{outline:2px solid #e6c46e;outline-offset:5px;border-radius:3px}
.contact-link svg{width:19px;height:19px;color:#e6c46e}
.hero{position:relative;overflow:hidden;padding:74px 0 58px;background:radial-gradient(ellipse at 12% 15%,#e7d6aa88,transparent 35%),linear-gradient(115deg,#f5edda,#faf8f3 68%);border-bottom:1px solid var(--line)}
.hero:after{position:absolute;top:-130px;inset-inline-end:-95px;width:340px;height:340px;border:1px solid #bd8c2433;border-radius:50%;box-shadow:0 0 0 35px #bd8c2408,0 0 0 70px #bd8c2406;content:"";pointer-events:none}
.hero .container{position:relative;z-index:1;animation:hero-enter .7s ease both}
.hero h1{max-width:680px;margin:0 0 12px;font-size:clamp(32px,5vw,52px);line-height:1.35;letter-spacing:-1px}
.hero p{max-width:650px;margin:0;color:var(--muted);font-size:17px;line-height:1.9}
.toolbar{display:flex;align-items:center;gap:12px;margin:28px 0}
.search{flex:1;min-width:180px}
.search input,.settings-form input{width:100%;padding:14px 16px;border:1px solid var(--line);border-radius:13px;background:#fff;color:var(--text);box-shadow:0 5px 16px #211c1208;transition:border-color .2s,box-shadow .2s}
.search input:focus,.settings-form input:focus{outline:3px solid #bd8c2422;border-color:var(--gold)}
.select{min-width:180px;padding:13px 15px;border:1px solid var(--line);border-radius:13px;background:#fff;color:var(--text);font:inherit;box-shadow:0 5px 16px #211c1208}
.button{border:0;border-radius:12px;padding:13px 17px;background:var(--gold);color:#17120a;font-weight:700;transition:transform .2s,background .2s}
.button:hover{background:#d6aa46}
.button:hover,.order-button:hover{transform:translateY(-2px)}
.button:disabled{opacity:.6;cursor:wait}
.button.secondary{background:#f1eadb;color:var(--text)}
.button.secondary:hover{background:#e8dcc0}
.section-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:26px 0 16px}
.section-heading h2{margin:0;font-size:22px}
.count{color:var(--muted);font-size:14px}
.products{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;margin-bottom:64px}
.product-card{overflow:hidden;border:1px solid var(--line);border-radius:20px;background:var(--card);box-shadow:0 8px 24px #17251e08;animation:card-enter .55s both;transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease}
.product-card:hover{transform:translateY(-6px);border-color:#d6c18d;box-shadow:0 18px 38px #211c1216}
.product-card:nth-child(4n+2){animation-delay:.06s}.product-card:nth-child(4n+3){animation-delay:.12s}.product-card:nth-child(4n+4){animation-delay:.18s}
.product-details-link{display:block;color:inherit;text-decoration:none}
.product-details-link:focus-visible{outline:3px solid #bd8c2466;outline-offset:-3px}
.product-image{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:#edf0ed}
.image-placeholder{display:grid;aspect-ratio:4/3;place-items:center;background:#edf0ed;color:#8a968e;font-size:14px}
.product-info{padding:17px}
.category{display:inline-block;margin-bottom:8px;color:var(--gold-dark);font-size:12px;font-weight:700}
.product-name{margin:0 0 8px;font-size:17px;line-height:1.6}
.description{display:-webkit-box;overflow:hidden;min-height:42px;margin:0 0 12px;color:var(--muted);font-size:13px;line-height:1.7;-webkit-box-orient:vertical;-webkit-line-clamp:2}
.prices{display:flex;align-items:baseline;gap:8px}
.price{color:var(--gold-dark);font-size:19px;font-weight:800}
.old-price{color:#89928b;font-size:13px;text-decoration:line-through}
.availability{margin-top:11px;color:var(--muted);font-size:12px}
.availability.out{color:var(--danger)}
.order-button{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;margin-top:16px;padding:12px 14px;border:1px solid #188c55;border-radius:12px;background:#168a50;color:#fff;font-size:14px;font-weight:700;text-decoration:none;transition:transform .2s,background .2s,box-shadow .2s}
.order-button:hover{background:#117444;box-shadow:0 8px 18px #168a5033}
.order-button:focus-visible{outline:3px solid #168a5066;outline-offset:3px}
.order-button svg{width:19px;height:19px;flex:none}
.notice{padding:16px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--muted);line-height:1.8}
.notice.error{border-color:#f0caca;background:#fff5f5;color:#8c2525}
.footer{padding:22px 0;border-top:1px solid var(--line);color:var(--muted);font-size:13px;text-align:center}
@keyframes hero-enter{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes card-enter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
@media(max-width:900px){.products{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:650px){.products{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.product-info{padding:13px}.toolbar{align-items:stretch;flex-direction:column}.select{width:100%}.hero{padding:46px 0 36px}.topbar-note{font-size:12px}.topbar-actions{gap:12px}.contact-link{gap:5px;font-size:12px}.topbar-inner{min-height:70px}}
@media(max-width:390px){.container{width:min(100% - 24px,1160px)}.products{grid-template-columns:1fr;gap:15px}.product-image,.image-placeholder{aspect-ratio:16/10}.product-info{padding:16px}}
</style>
</head>
<body>
<header class="topbar">
  <div class="container topbar-inner">
    <div class="brand"><img src="Logo.png" alt="شعار A&Z Girls Fashion"><div>A&Z<span>GIRLS FASHION</span></div></div>
    <div class="topbar-actions">
      <div class="topbar-note">منتجات مختارة بعناية</div>
      <a class="contact-link" href="https://aandz-eng.github.io/Qr/" target="_blank" rel="noopener noreferrer" aria-label="تواصل معنا">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8A8.5 8.5 0 0 1 8.7 3.9a8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8z"/></svg>
        تواصل معنا
      </a>
    </div>
  </div>
</header>
<main>
  <section class="hero">
    <div class="container">
      <h1>اكتشف منتجاتنا</h1>
      <p>تصفّح المنتجات المتاحة واختر ما يناسبك. يتم تحديث المعروض من قاعدة بيانات المتجر مباشرة.</p>
    </div>
  </section>
  <section class="container" aria-label="قائمة المنتجات">
    <div class="toolbar">
      <label class="search"><input id="searchInput" type="search" placeholder="ابحث عن منتج..." aria-label="ابحث عن منتج"></label>
      <select class="select" id="categoryFilter" aria-label="تصفية حسب التصنيف">
        <option value="">كل التصنيفات</option>
      </select>
      <button class="button secondary" id="reloadButton" type="button">تحديث المنتجات</button>
    </div>
    <div class="section-heading">
      <h2>منتجات المتجر</h2>
      <span class="count" id="productCount"></span>
    </div>
    <div id="products" class="products" aria-live="polite">
      <p class="notice">جاري تحميل المنتجات...</p>
    </div>
  </section>
</main>
<footer class="footer"><div class="container">AZstore</div></footer>
<script>
const $=id=>document.getElementById(id);
const SUPABASE_URL='https://utveqafgrnjxvprpedba.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_ZTiDMTbKajTwjxlWYyn9IQ_bATWbIX6';
const WHATSAPP_PHONE='201113041491';
let allProducts=[];

function escapeHtml(value){
  return String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
}

async function fetchProducts(){
  const button=$('reloadButton');
  button.disabled=true;
  $('products').innerHTML='<p class="notice">جاري تحميل المنتجات...</p>';
  try{
    const query=new URLSearchParams({
      select:'id,name,description,price,old_price,stock,active,category,product_images(image_url,is_main,sort_order)',
      active:'eq.true',
      order:'id.desc'
    });
    const response=await fetch(SUPABASE_URL+'/rest/v1/products?'+query.toString(),{
      headers:{apikey:SUPABASE_PUBLISHABLE_KEY,Authorization:'Bearer '+SUPABASE_PUBLISHABLE_KEY}
    });
    const text=await response.text();
    if(!response.ok)throw new Error(text||('HTTP '+response.status));
    allProducts=text?JSON.parse(text):[];
    updateCategories();
    renderProducts();
  }catch(error){
    allProducts=[];
    updateCategories();
    $('productCount').textContent='';
    $('products').innerHTML='<p class="notice error">تعذر تحميل المنتجات: '+escapeHtml(error.message)+'</p>';
  }finally{
    button.disabled=false;
  }
}

function updateCategories(){
  const select=$('categoryFilter');
  const previous=select.value;
  const categories=[...new Set(allProducts.map(product=>String(product.category||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ar'));
  select.innerHTML='<option value="">كل التصنيفات</option>'+categories.map(category=>'<option value="'+escapeHtml(category)+'">'+escapeHtml(category)+'</option>').join('');
  if(categories.includes(previous))select.value=previous;
}

function productCard(product){
  const images=[...(product.product_images||[])].sort((a,b)=>(Number(b.is_main)-Number(a.is_main))||(Number(a.sort_order)-Number(b.sort_order)));
  const image=images.find(item=>item.image_url)?.image_url;
  const price=Number(product.price);
  const oldPrice=product.old_price==null?'':Number(product.old_price);
  const hasDiscount=Number.isFinite(price)&&Number.isFinite(oldPrice)&&oldPrice>price;
  const stock=Number(product.stock||0);
  const imageMarkup=image
    ?'<img class="product-image" src="'+escapeHtml(image)+'" alt="'+escapeHtml(product.name)+'" loading="lazy">'
    :'<div class="image-placeholder">لا توجد صورة</div>';
  const formattedPrice=Number.isFinite(price)?price.toLocaleString('en-EG',{minimumFractionDigits:2,maximumFractionDigits:2})+' ج.م':'';
  const orderMessage='مرحبًا، أريد طلب المنتج: '+product.name+(formattedPrice?' - السعر: '+formattedPrice:'');
  const orderUrl='https://wa.me/'+WHATSAPP_PHONE+'?text='+encodeURIComponent(orderMessage);
  return '<article class="product-card"><a class="product-details-link" href="product.html?id='+encodeURIComponent(String(product.id))+'" aria-label="عرض تفاصيل '+escapeHtml(product.name)+'">'+imageMarkup+'<div class="product-info">'+
    (product.category?'<span class="category">'+escapeHtml(product.category)+'</span>':'')+
    '<h3 class="product-name">'+escapeHtml(product.name)+'</h3>'+
    '<p class="description">'+escapeHtml(product.description||'')+'</p>'+
    '<div class="prices"><span class="price">'+(formattedPrice||'—')+'</span>'+
    (hasDiscount?'<span class="old-price">'+oldPrice.toLocaleString('en-EG',{minimumFractionDigits:2,maximumFractionDigits:2})+' ج.م</span>':'')+
    '</div><div class="availability'+(stock<=0?' out':'')+'">'+(stock>0?'متوفر ('+stock+')':'غير متوفر حالياً')+'</div>'+
    '</div></a><a class="order-button" href="'+orderUrl+'" target="_blank" rel="noopener noreferrer" aria-label="اطلب '+escapeHtml(product.name)+' عبر واتساب"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.52 3.48A11.8 11.8 0 0 0 12.12 0C5.57 0 .24 5.33.24 11.88c0 2.1.55 4.15 1.6 5.96L.14 24l6.3-1.65a11.9 11.9 0 0 0 5.68 1.45h.01c6.55 0 11.88-5.33 11.88-11.88 0-3.17-1.23-6.15-3.49-8.44ZM12.13 21.8h-.01a9.9 9.9 0 0 1-5.04-1.38l-.36-.21-3.74.98 1-3.65-.24-.37a9.86 9.86 0 0 1-1.52-5.29c0-5.46 4.45-9.91 9.91-9.91a9.84 9.84 0 0 1 7.01 2.91 9.84 9.84 0 0 1 2.9 7.01c0 5.46-4.45 9.91-9.91 9.91Zm5.44-7.42c-.3-.15-1.76-.87-2.03-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.95 1.17-.17.2-.35.22-.65.07-.3-.15-1.25-.46-2.38-1.47-.88-.78-1.47-1.75-1.64-2.05-.17-.3-.02-.46.13-.6.13-.13.3-.35.44-.52.15-.18.2-.3.3-.5.1-.2.05-.37-.03-.52-.08-.15-.67-1.61-.92-2.2-.24-.57-.48-.5-.67-.51h-.57c-.2 0-.52.07-.79.37-.27.3-1.04 1.02-1.04 2.48s1.07 2.87 1.22 3.07c.15.2 2.1 3.2 5.08 4.49.71.3 1.26.49 1.69.63.71.23 1.36.2 1.87.12.57-.08 1.76-.72 2.01-1.42.25-.7.25-1.29.17-1.42-.07-.13-.27-.2-.57-.35Z"/></svg>اطلب الآن</a></article>';
}

function renderProducts(){
  const search=$('searchInput').value.trim().toLocaleLowerCase('ar');
  const category=$('categoryFilter').value;
  const filtered=allProducts.filter(product=>{
    const text=[product.name,product.description,product.category].filter(Boolean).join(' ').toLocaleLowerCase('ar');
    return (!search||text.includes(search))&&(!category||product.category===category);
  });
  $('productCount').textContent='عدد المنتجات: '+filtered.length;
  if(filtered.length){
    $('products').innerHTML=filtered.map(productCard).join('');
  }else if(!allProducts.length){
    $('products').innerHTML='<p class="notice">لا توجد منتجات منشورة ظاهرة للزوار حالياً. فعّل خيار «المنتج ظاهر في المتجر» من لوحة الإدارة، وتأكد من تشغيل ملف admin-rls-policies.sql في Supabase SQL Editor للسماح بقراءة المنتجات النشطة.</p>';
  }else{
    $('products').innerHTML='<p class="notice">لا توجد منتجات تطابق البحث أو التصنيف المحدد.</p>';
  }
}

$('reloadButton').addEventListener('click',fetchProducts);
$('searchInput').addEventListener('input',renderProducts);
$('categoryFilter').addEventListener('change',renderProducts);

fetchProducts();
</script>
</body>
</html>
