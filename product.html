<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#11100d">
<title>تفاصيل المنتج | A&Z Girls Fashion</title>
<style>
:root{color-scheme:light;--bg:#faf8f3;--card:#fff;--text:#211c12;--muted:#756d5e;--gold:#bd8c24;--gold-dark:#8c6413;--ink:#11100d;--line:#eee5d3;--danger:#a42d2d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif}
a{color:inherit}
.container{width:min(1080px,100% - 32px);margin:auto}
.topbar{background:#11100df2;color:#fff;border-bottom:1px solid #bd8c2466}
.topbar-inner{min-height:78px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.brand{display:flex;align-items:center;gap:13px;font-size:20px;font-weight:800;letter-spacing:.3px;text-decoration:none}
.brand img{width:58px;height:58px;border:2px solid var(--gold);border-radius:50%;background:#fff;object-fit:cover}
.brand span{display:block;margin-top:3px;color:#e6c46e;font-size:12px;letter-spacing:1.6px}
.back-link{color:#ead9aa;font-size:14px;text-decoration:none}
.back-link:hover{text-decoration:underline}
.header-links{display:flex;align-items:center;gap:20px}
.contact-link{display:inline-flex;align-items:center;gap:7px;color:#fff;font-size:14px;font-weight:700;text-decoration:none;transition:color .2s}
.contact-link:hover{color:#e6c46e}
.contact-link:focus-visible{outline:2px solid #e6c46e;outline-offset:5px;border-radius:3px}
.contact-link svg{width:19px;height:19px;color:#e6c46e}
.main{padding:30px 0 64px}
.breadcrumb{margin-bottom:20px;color:var(--muted);font-size:14px}
.breadcrumb a{color:var(--gold-dark);text-decoration:none}
.product-layout{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(320px,.92fr);gap:38px;align-items:start;animation:enter .5s ease both}
.gallery,.details{border:1px solid var(--line);border-radius:20px;background:var(--card);box-shadow:0 12px 34px #211c120a}
.gallery{overflow:hidden;padding:14px}
.main-image-wrap{overflow:hidden;border-radius:14px;background:#f0eee8}
.main-image{display:block;width:100%;aspect-ratio:4/3;object-fit:contain}
.image-placeholder{display:grid;aspect-ratio:4/3;place-items:center;color:var(--muted);background:#f0eee8}
.thumbnails{display:flex;gap:10px;overflow-x:auto;padding:13px 1px 2px}
.thumbnail{flex:0 0 76px;width:76px;height:76px;overflow:hidden;padding:0;border:2px solid transparent;border-radius:11px;background:#f0eee8;cursor:pointer}
.thumbnail[aria-pressed=true]{border-color:var(--gold);box-shadow:0 0 0 2px #bd8c2422}
.thumbnail img{display:block;width:100%;height:100%;object-fit:cover}
.details{padding:30px}
.category{display:inline-block;margin-bottom:12px;color:var(--gold-dark);font-size:13px;font-weight:700}
h1{margin:0 0 14px;font-size:clamp(25px,4vw,36px);line-height:1.5}
.description{margin:0;color:var(--muted);font-size:15px;line-height:2;white-space:pre-wrap}
.divider{height:1px;margin:22px 0;background:var(--line)}
.prices{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.price{color:var(--gold-dark);font-size:27px;font-weight:800}
.old-price{color:#89928b;font-size:16px;text-decoration:line-through}
.availability{margin-top:14px;color:#4f7458;font-size:14px;font-weight:700}
.availability.out{color:var(--danger)}
.order-button{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;margin-top:24px;padding:14px 18px;border:1px solid #188c55;border-radius:12px;background:#168a50;color:#fff;font-size:16px;font-weight:700;text-decoration:none;transition:transform .2s,background .2s,box-shadow .2s}
.order-button:hover{transform:translateY(-2px);background:#117444;box-shadow:0 8px 18px #168a5033}
.order-button:focus-visible,.thumbnail:focus-visible{outline:3px solid #168a5066;outline-offset:3px}
.order-button svg{width:20px;height:20px}
.notice{padding:18px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--muted);line-height:1.8}
.notice.error{border-color:#f0caca;background:#fff5f5;color:#8c2525}
.footer{padding:22px 0;border-top:1px solid var(--line);color:var(--muted);font-size:13px;text-align:center}
@keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@media(max-width:760px){.product-layout{grid-template-columns:1fr;gap:18px}.details{padding:22px}.main{padding-top:22px}}
@media(max-width:420px){.container{width:calc(100% - 24px)}.topbar-inner{min-height:68px}.brand{font-size:17px}.brand img{width:50px;height:50px}.header-links{gap:10px}.back-link,.contact-link{font-size:11px}.contact-link{gap:4px}.contact-link svg{width:16px;height:16px}.gallery{padding:10px}.details{padding:18px}}
</style>
</head>
<body>
<header class="topbar">
  <div class="container topbar-inner">
    <a class="brand" href="index.html"><img src="Logo.png" alt="شعار A&Z Girls Fashion"><div>A&Z<span>GIRLS FASHION</span></div></a>
    <nav class="header-links" aria-label="روابط المتجر">
      <a class="contact-link" href="https://aandz-eng.github.io/Qr/" target="_blank" rel="noopener noreferrer" aria-label="تواصل معنا">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8A8.5 8.5 0 0 1 8.7 3.9a8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8z"/></svg>
        تواصل معنا
      </a>
      <a class="back-link" href="index.html">العودة إلى المنتجات</a>
    </nav>
  </div>
</header>
<main class="container main">
  <div class="breadcrumb"><a href="index.html">المتجر</a> / تفاصيل المنتج</div>
  <div id="productDetails" aria-live="polite"><p class="notice">جاري تحميل تفاصيل المنتج...</p></div>
</main>
<footer class="footer"><div class="container">AZstore</div></footer>
<script>
const SUPABASE_URL='https://utveqafgrnjxvprpedba.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_ZTiDMTbKajTwjxlWYyn9IQ_bATWbIX6';
const WHATSAPP_PHONE='201113041491';
const root=document.getElementById('productDetails');
let productImages=[];
let activeImageIndex=0;

function escapeHtml(value){
  return String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
}

function formatPrice(value){
  const price=Number(value);
  return Number.isFinite(price)?price.toLocaleString('en-EG',{minimumFractionDigits:2,maximumFractionDigits:2})+' ج.م':'—';
}

function showError(message){
  root.innerHTML='<p class="notice error">'+escapeHtml(message)+'</p>';
}

function renderGallery(){
  const mainImage=document.getElementById('mainImage');
  if(!productImages.length){
    mainImage.outerHTML='<div class="image-placeholder">لا توجد صور لهذا المنتج</div>';
    document.getElementById('thumbnails').hidden=true;
    return;
  }
  mainImage.src=productImages[activeImageIndex].image_url;
  mainImage.alt='صورة '+(activeImageIndex+1)+' من '+productImages.length+' للمنتج';
  document.querySelectorAll('.thumbnail').forEach((button,index)=>{
    button.setAttribute('aria-pressed',String(index===activeImageIndex));
  });
}

function selectImage(index){
  activeImageIndex=index;
  renderGallery();
}

function renderProduct(product){
  productImages=[...(product.product_images||[])].filter(image=>image.image_url)
    .sort((a,b)=>(Number(b.is_main)-Number(a.is_main))||(Number(a.sort_order)-Number(b.sort_order)));
  activeImageIndex=0;
  const price=Number(product.price);
  const oldPrice=product.old_price==null?NaN:Number(product.old_price);
  const hasDiscount=Number.isFinite(price)&&Number.isFinite(oldPrice)&&oldPrice>price;
  const stock=Number(product.stock||0);
  const message='مرحبًا، أريد طلب المنتج: '+product.name+' - السعر: '+formatPrice(product.price);
  const orderUrl='https://wa.me/'+WHATSAPP_PHONE+'?text='+encodeURIComponent(message);
  document.title=product.name+' | A&Z Girls Fashion';
  root.innerHTML='<section class="product-layout">'+
    '<div class="gallery"><div class="main-image-wrap"><img class="main-image" id="mainImage" alt=""></div>'+
    '<div class="thumbnails" id="thumbnails" aria-label="صور المنتج">'+productImages.map((image,index)=>
      '<button class="thumbnail" type="button" aria-label="عرض الصورة '+(index+1)+'" aria-pressed="'+(index===0)+'" onclick="selectImage('+index+')"><img src="'+escapeHtml(image.image_url)+'" alt="" loading="lazy"></button>'
    ).join('')+'</div></div>'+
    '<section class="details">'+
    (product.category?'<span class="category">'+escapeHtml(product.category)+'</span>':'')+
    '<h1>'+escapeHtml(product.name)+'</h1>'+
    (product.description?'<p class="description">'+escapeHtml(product.description)+'</p>':'<p class="description">لا يوجد وصف إضافي لهذا المنتج.</p>')+
    '<div class="divider"></div><div class="prices"><span class="price">'+formatPrice(product.price)+'</span>'+
    (hasDiscount?'<span class="old-price">'+formatPrice(product.old_price)+'</span>':'')+'</div>'+
    '<div class="availability'+(stock<=0?' out':'')+'">'+(stock>0?'متوفر ('+stock+')':'غير متوفر حالياً')+'</div>'+
    '<a class="order-button" href="'+orderUrl+'" target="_blank" rel="noopener noreferrer"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.52 3.48A11.8 11.8 0 0 0 12.12 0C5.57 0 .24 5.33.24 11.88c0 2.1.55 4.15 1.6 5.96L.14 24l6.3-1.65a11.9 11.9 0 0 0 5.68 1.45h.01c6.55 0 11.88-5.33 11.88-11.88 0-3.17-1.23-6.15-3.49-8.44ZM12.13 21.8h-.01a9.9 9.9 0 0 1-5.04-1.38l-.36-.21-3.74.98 1-3.65-.24-.37a9.86 9.86 0 0 1-1.52-5.29c0-5.46 4.45-9.91 9.91-9.91a9.84 9.84 0 0 1 7.01 2.91 9.84 9.84 0 0 1 2.9 7.01c0 5.46-4.45 9.91-9.91 9.91Zm5.44-7.42c-.3-.15-1.76-.87-2.03-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.95 1.17-.17.2-.35.22-.65.07-.3-.15-1.25-.46-2.38-1.47-.88-.78-1.47-1.75-1.64-2.05-.17-.3-.02-.46.13-.6.13-.13.3-.35.44-.52.15-.18.2-.3.3-.5.1-.2.05-.37-.03-.52-.08-.15-.67-1.61-.92-2.2-.24-.57-.48-.5-.67-.51h-.57c-.2 0-.52.07-.79.37-.27.3-1.04 1.02-1.04 2.48s1.07 2.87 1.22 3.07c.15.2 2.1 3.2 5.08 4.49.71.3 1.26.49 1.69.63.71.23 1.36.2 1.87.12.57-.08 1.76-.72 2.01-1.42.25-.7.25-1.29.17-1.42-.07-.13-.27-.2-.57-.35Z"/></svg>اطلب الآن عبر واتساب</a>'+
    '</section></section>';
  renderGallery();
}

async function loadProduct(){
  const id=new URLSearchParams(location.search).get('id');
  if(!id||!/^\d+$/.test(id)){
    showError('رابط المنتج غير صالح. ارجع إلى المتجر واختر منتجاً من القائمة.');
    return;
  }
  try{
    const query=new URLSearchParams({
      select:'id,name,description,price,old_price,stock,active,category,product_images(image_url,is_main,sort_order)',
      id:'eq.'+id,
      active:'eq.true'
    });
    const response=await fetch(SUPABASE_URL+'/rest/v1/products?'+query.toString(),{
      headers:{apikey:SUPABASE_PUBLISHABLE_KEY,Authorization:'Bearer '+SUPABASE_PUBLISHABLE_KEY}
    });
    const text=await response.text();
    if(!response.ok)throw new Error(text||('HTTP '+response.status));
    const products=text?JSON.parse(text):[];
    if(!products.length){
      showError('المنتج غير موجود أو لم يعد متاحاً في المتجر.');
      return;
    }
    renderProduct(products[0]);
  }catch(error){
    showError('تعذر تحميل تفاصيل المنتج: '+error.message);
  }
}

loadProduct();
</script>
</body>
</html>
